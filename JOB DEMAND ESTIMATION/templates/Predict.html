<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Predict — Job Demand Estimation</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f8fafc;
            --white: #ffffff;
            --primary: #2563eb;
            --text-main: #0f172a;
            --text-sub: #64748b;
            --border: #e2e8f0;
            --error: #ef4444;
            --success: #10b981;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
        }

        nav {
            background: var(--white);
            border-bottom: 1px solid var(--border);
            padding: 0 8%;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo { font-weight: 700; font-size: 1.1rem; text-decoration: none; color: var(--text-main); }
        .logo span { color: var(--primary); }

        .container {
            max-width: 1100px;
            margin: 48px auto;
            padding: 0 24px;
        }

        .page-header { margin-bottom: 32px; }
        .page-header h1 { font-size: 1.75rem; letter-spacing: -0.02em; }
        .page-header p { color: var(--text-sub); margin-top: 4px; }

        .grid {
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 32px;
        }

        .card {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 32px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        /* Error Banner */
        #errorBanner {
            display: none;
            background: #fef2f2;
            border: 1px solid #fee2e2;
            color: var(--error);
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.85rem;
            font-weight: 500;
            align-items: center;
            gap: 8px;
        }

        .drop-zone {
            border: 2px dashed var(--border);
            border-radius: 12px;
            padding: 50px 20px;
            text-align: center;
            background: #fdfdfd;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

        .drop-zone.dragover { border-color: var(--primary); background: #f0f7ff; }
        .drop-zone.has-error { border-color: var(--error); background: #fff1f2; }
        .drop-zone input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

        .file-info {
            display: none;
            margin-top: 20px;
            padding: 12px 16px;
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 8px;
            align-items: center;
            gap: 12px;
        }

        .file-info.visible { display: flex; }
        
        .btn-submit {
            width: 100%;
            background: var(--text-main);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-weight: 600;
            margin-top: 24px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-submit:disabled { background: var(--border); cursor: not-allowed; }

        /* Sidebar UI */
        .sidebar-card {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
        }

        .sidebar-card h4 { font-size: 0.8rem; text-transform: uppercase; color: var(--text-sub); margin-bottom: 12px; }

        @media (max-width: 850px) { .grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <nav>
        <a href="/index" class="logo">Job<span>Demand</span></a>
        <div class="nav-links">
            <a href="/Predict" style="color: var(--primary); font-weight: 600; text-decoration: none;">Analyze</a>
        </div>
    </nav>

    <div class="container">
        <div class="page-header">
            <h1>Predictive Analysis</h1>
            <p>Upload data to trigger the ensemble machine learning pipeline.</p>
        </div>

        <div class="grid">
            <div class="card">
                <!-- Inline Error Handling -->
                <div id="errorBanner">
                    <span>⚠️</span> <span id="errorMsg"></span>
                </div>

                <form id="predictForm" action="/PredictAction" method="post" enctype="multipart/form-data">
                    <div class="drop-zone" id="dropZone">
                        <input type="file" name="t1" id="fileInput" accept=".csv, .xlsx, .json">
                        <span style="font-size: 1.5rem;">📥</span>
                        <h3 id="dropZoneText">Click or drag file</h3>
                        <p>CSV or XLSX required</p>
                    </div>

                    <div class="file-info" id="fileInfo">
                        <span style="font-size: 1.2rem;">📄</span>
                        <div style="flex: 1; font-size: 0.85rem;">
                            <div id="fileName" style="font-weight: 600; color: #16a34a;"></div>
                            <div id="fileSize" style="color: #16a34a; opacity: 0.7;"></div>
                        </div>
                        <button type="button" onclick="resetFile()" style="background:none; border:none; cursor:pointer;">✕</button>
                    </div>

                    <button type="submit" class="btn-submit" id="submitBtn">Generate Estimation</button>
                </form>
            </div>

            <div class="right-sidebar">
                <div class="sidebar-card">
                    <h4>Model Constraints</h4>
                    <ul style="font-size: 0.85rem; color: var(--text-sub); padding-left: 1rem; line-height: 1.7;">
                        <li>Maximum file size: 10MB</li>
                        <li>Format: Standard CSV headers</li>
                        <li>IPC codes must be valid</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const dropZone = document.getElementById('dropZone');
        const errorBanner = document.getElementById('errorBanner');
        const errorMsg = document.getElementById('errorMsg');
        const submitBtn = document.getElementById('submitBtn');

        // Drag & Drop visual states
        ['dragenter', 'dragover'].forEach(name => {
            dropZone.addEventListener(name, (e) => {
                e.preventDefault();
                dropZone.classList.add('dragover');
            });
        });

        ['dragleave', 'drop'].forEach(name => {
            dropZone.addEventListener(name, () => dropZone.classList.remove('dragover'));
        });

        // Error handling & Validation
        fileInput.addEventListener('change', function() {
            const file = this.files[0];
            resetUI();

            if (!file) return;

            // 1. Check Extension
            const allowedTypes = ['text/csv', 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet', 'application/json'];
            const fileName = file.name.toLowerCase();
            const isValidExtension = fileName.endsWith('.csv') || fileName.endsWith('.xlsx') || fileName.endsWith('.json');

            if (!isValidExtension) {
                showError("Invalid file type. Please upload a .csv or .xlsx file.");
                return;
            }

            // 2. Check File Size (10MB limit)
            if (file.size > 10 * 1024 * 1024) {
                showError("File too large. Maximum size allowed is 10MB.");
                return;
            }

            // Success State
            document.getElementById('fileName').textContent = file.name;
            document.getElementById('fileSize').textContent = (file.size / 1024).toFixed(1) + ' KB';
            document.getElementById('fileInfo').classList.add('visible');
            dropZone.style.display = 'none';
        });

        function showError(msg) {
            errorMsg.textContent = msg;
            errorBanner.style.display = 'flex';
            dropZone.classList.add('has-error');
            fileInput.value = ''; // Clear the invalid file
        }

        function resetUI() {
            errorBanner.style.display = 'none';
            dropZone.classList.remove('has-error');
        }

        function resetFile() {
            fileInput.value = '';
            document.getElementById('fileInfo').classList.remove('visible');
            dropZone.style.display = 'block';
            resetUI();
        }

        // Form Submission validation
        document.getElementById('predictForm').onsubmit = function(e) {
            if (!fileInput.files.length) {
                e.preventDefault();
                showError("Please select a file before running the prediction.");
            }
        };
    </script>
</body>
</html>
